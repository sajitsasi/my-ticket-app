services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-app-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticket_app
    ports:
      - "5544:5432"
    volumes:
      - ticket-app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ticket-app-pgdata:
